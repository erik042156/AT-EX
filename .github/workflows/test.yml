name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check site reachability (diagnostic only)
        run: curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://automationexercise.com/login || true

      - name: Run pytest
        env:
          HEADLESS: "true"
        run: |
          set -o pipefail
          pytest tests/ --html=reports/report.html 2>&1 | tee reports/pytest_output.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

      - name: Upload failure screenshots and page source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Extract failed test summary
        if: failure()
        run: |
          {
            echo "FAILED_TESTS<<EOF"
            python3 .github/scripts/extract_failed_tests.py
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Notify Slack on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,commit,author,ref,workflow,job
          text: "테스트 실패\n${{ env.FAILED_TESTS }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
